services:
  grpc:
    container_name: ocr-gateway-grpc
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    ports:
      - "8083:8083"
      - "9093:9093"
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

# The document.processed consumer and the outbox publisher ditambahkan di sini
# bersama cmd/consumer dan cmd/worker, dengan entrypoint /app/consumer dan
# /app/worker. Expense menunjuk container ini lewat OCR_GATEWAY_TARGET di
# .env.compose miliknya (ocr-gateway-grpc:9093).

networks:
  data:
    external: true
    name: data

  messaging:
    external: true
    name: messaging

  observability:
    external: true
    name: observability
